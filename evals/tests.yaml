- description: Wizard EN Control — matched neutral source is not classified as Wizard
  vars:
    evalStage: voice
    persona: wizard
    locale: en
    intensity: balanced
    presentationMode: neutral
    sourceAnswer: &wizard_event_loop_source >-
      Synchronous code first runs on the call stack. `Promise.resolve().then(...)` queues a microtask, while `setTimeout(..., 0)` makes its callback eligible for a later task-queue turn. After the call stack empties, the runtime drains the microtask queue before taking the next task, so the promise handler runs first in this example. The `0` is a minimum delay, not a guarantee of immediate execution. This description assumes the standard browser event-loop model for this isolated example.
  providerOutput: *wizard_event_loop_source
  metadata:
    recognizabilityArm: control
    workloadId: wizard-event-loop-en
  assert:
    - type: equals
      value: *wizard_event_loop_source
      metric: control-fidelity
    - type: javascript
      value: file://assertions/blind-persona-classifier.mjs
      metric: blind-persona-recognition
      config:
        forbiddenLabel: wizard


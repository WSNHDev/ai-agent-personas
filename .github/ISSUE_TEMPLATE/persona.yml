name: Persona proposal
description: Propose a new persona or a substantial change to an existing voice
title: "persona: "
labels:
  - persona
  - needs-review
body:
  - type: markdown
    attributes:
      value: |
        A strong persona solves a user need, remains useful without catchphrases, and is safe in both English and Russian. Please read `docs/persona-authoring.md` and `docs/safety.md` first.
  - type: input
    id: name
    attributes:
      label: Persona name
      description: Use an original archetype, not a named character or real person.
      placeholder: Cartographer
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What recurring task or interaction becomes better with this persona?
      placeholder: Helps users navigate ambiguous projects by mapping goals, constraints, and routes.
    validations:
      required: true
  - type: textarea
    id: voice
    attributes:
      label: Output-only Voice
      description: Describe presentation directions, recurring motifs, avoid rules, and what changes at each Voice intensity without changing the answer's substance.
    validations:
      required: true
  - type: textarea
    id: task_modes
    attributes:
      label: Optional Task modes
      description: Name compatible task methods, where each helps, and where it must not be activated.
    validations:
      required: true
  - type: textarea
    id: differentiation
    attributes:
      label: Catalog differentiation
      description: How is this meaningfully different from the seven existing personas?
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and mitigations
      description: Name archetype-specific coercion, bias, safety, impersonation, or usability risks and the pre-action boundaries that mitigate them.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Voice transformation example
      description: Give one neutral source and a substance-preserving rendered answer in English and Russian.
    validations:
      required: true
  - type: checkboxes
    id: declaration
    attributes:
      label: Contributor declaration
      options:
        - label: This proposal does not imitate a specific copyrighted character, public figure, creator, or living person.
          required: true
        - label: I agree to contribute code under MIT and content under CC BY 4.0.
          required: true

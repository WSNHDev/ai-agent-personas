name: Persona evaluations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persona-evals
  cancel-in-progress: false

jobs:
  evaluate:
    name: Run model-backed quality and safety suite
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: model-evaluations
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic checks
        run: pnpm check

      - name: Run Promptfoo
        id: promptfoo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          node scripts/promptfoo.mjs eval
          -c evals/promptfooconfig.yaml
          --output eval-results.html
          --output eval-results.json

      - name: Record evaluation provenance
        if: always()
        env:
          EVAL_CONFIG_PATH: evals/promptfooconfig.yaml
          EVAL_OUTCOME: ${{ steps.promptfoo.outcome }}
          EVAL_PROVIDER: openai:responses:gpt-5.4-mini
          EVAL_RESULTS_PATH: eval-results.json
        run: node scripts/write-eval-metadata.mjs

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: persona-evaluation-${{ github.sha }}
          path: |
            eval-results.html
            eval-results.json
            eval-attestation.json
          if-no-files-found: error
          retention-days: 30
